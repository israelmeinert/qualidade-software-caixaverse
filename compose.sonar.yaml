name: caixaverse-rewards-sonar
services:
  sonar:
    image: sonarqube:26.11.0.134175-community@sha256:65541accbdb92e27fe770fc6ba99988a3dd5a0c71ffafd67f88abfad366996fa
    ports:
      - "127.0.0.1:19000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: ${SONAR_ES_BOOTSTRAP_CHECKS_DISABLE:-false}
    ulimits:
      nofile: {soft: 131072, hard: 131072}
      nproc: 8192
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
volumes:
  sonar-data:
  sonar-extensions:
