name: Qualidade
on:
  pull_request:
    branches: [final]
  push:
    branches: [final]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-alpine@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
        env:
          POSTGRES_DB: rewards_test
          POSTGRES_USER: rewards
          POSTGRES_PASSWORD: local-rewards
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U rewards -d rewards_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -Pcoverage clean verify
      - name: Verificar relatório de cobertura
        run: test -s target/jacoco-report/jacoco.xml
      - name: Publicar evidências de testes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_attempt }}
          path: |
            target/jacoco-report/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Transferir classes e cobertura da execução
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-input-${{ github.run_attempt }}
          path: |
            target/classes/
            target/test-classes/
            target/jacoco-report/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: error
          retention-days: 1

  sonar:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/final' }}
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-input-${{ github.run_attempt }}
          path: target
      - name: SonarQube e Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          : "${SONAR_TOKEN:?Secret SONAR_TOKEN pendente na configuração do repositório}"
          : "${SONAR_HOST_URL:?Variable SONAR_HOST_URL pendente}"
          : "${SONAR_PROJECT_KEY:?Variable SONAR_PROJECT_KEY pendente}"
          test -s target/jacoco-report/jacoco.xml
          ./mvnw -B -Pcoverage org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Executar PIT e verificar o relatório
        run: |
          ./mvnw -B -Pmutation clean test-compile org.pitest:pitest-maven:1.30.2:mutationCoverage \
            -Dpit.mutationThreshold=80 -Dpit.coverageThreshold=80
          python3 scripts/check-mutations.py target/pit-reports/mutations.xml
      - name: Publicar mutação
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-${{ github.run_attempt }}
          path: target/pit-reports/
          if-no-files-found: warn
          retention-days: 14

  quality-required:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [tests, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: bash scripts/require-success.sh

  quality-required-delivery:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/final' }}
    needs: [tests, mutation, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: bash scripts/require-success.sh
