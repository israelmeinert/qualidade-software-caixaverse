name: Qualidade
on:
  pull_request:
    branches: [final]
  push:
    branches: [final]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-alpine@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
        env:
          POSTGRES_DB: rewards_test
          POSTGRES_USER: rewards
          POSTGRES_PASSWORD: local-rewards
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U rewards -d rewards_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -Pcoverage clean verify
      - name: Verificar relatório de cobertura
        run: test -s target/jacoco-report/jacoco.xml
      - name: Publicar evidências de testes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_attempt }}
          path: |
            target/jacoco-report/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Transferir classes e cobertura da execução
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-input-${{ github.run_attempt }}
          path: |
            target/classes/
            target/test-classes/
            target/jacoco-report/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: error
          retention-days: 1

  sonar:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/final' }}
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-input-${{ github.run_attempt }}
          path: target
      - name: SonarQube e Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          : "${SONAR_TOKEN:?Secret SONAR_TOKEN pendente na configuração do repositório}"
          : "${SONAR_HOST_URL:?Variable SONAR_HOST_URL pendente}"
          : "${SONAR_PROJECT_KEY:?Variable SONAR_PROJECT_KEY pendente}"
          test -s target/jacoco-report/jacoco.xml
          ./mvnw -B -Pcoverage org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Executar PIT e verificar o relatório
        run: |
          ./mvnw -B -Pmutation clean test-compile org.pitest:pitest-maven:1.30.2:mutationCoverage \
            -Dpit.mutationThreshold=80 -Dpit.coverageThreshold=80
          python3 scripts/check-mutations.py target/pit-reports/mutations.xml
      - name: Publicar mutação
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-${{ github.run_attempt }}
          path: target/pit-reports/
          if-no-files-found: warn
          retention-days: 14

  quality-required:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [tests, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: bash scripts/require-success.sh

  quality-required-delivery:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/final' }}
    needs: [tests, mutation, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: bash scripts/require-success.sh

  publish-image:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/final' }}
    needs: quality-required-delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - name: Publicar imagem JVM por SHA e capturar digest
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          builder="rewards-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker buildx create --name "$builder" --use --driver docker-container \
            --driver-opt image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64 --push --provenance=mode=min \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$GITHUB_SHA" --metadata-file "$RUNNER_TEMP/image-metadata.json" .
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' \
            "$RUNNER_TEMP/image-metadata.json")
          printf 'image=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"

  deploy-staging:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/final' && vars.STAGING_ENABLED == 'true' }}
    needs: [quality-required-delivery, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Implantar e verificar em staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_SMOKE_URL: ${{ vars.DEPLOY_SMOKE_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_IMAGE: ${{ needs.publish-image.outputs.image }}
        run: bash scripts/deploy/ssh-update.sh "$RELEASE_IMAGE"
      - name: Registrar o digest verificado
        env:
          RELEASE_IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg image "$RELEASE_IMAGE" \
            '{$repository, $sha, $run_id, $attempt, $image}' > release.json
      - name: Publicar manifesto de release de staging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 30
