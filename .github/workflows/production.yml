name: Promover produção
on:
  workflow_dispatch:
    inputs:
      delivery_run:
        description: ID da execução de qualidade com staging aprovado
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.verify.outputs.image }}
    steps:
      - name: Rejeitar dispatch fora de final
        env:
          DISPATCH_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [[ "$DISPATCH_REF" != refs/heads/final ]]; then
            echo "::error::Selecione final como referência para promover a release."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar proveniência, staging e digest
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_RUN: ${{ inputs.delivery_run }}
        run: |
          image=$(bash scripts/deploy/resolve-release.sh "$DELIVERY_RUN")
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

  deploy-production:
    if: ${{ github.ref == 'refs/heads/final' && needs.verify-release.result == 'success' }}
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Implantar e verificar o digest aprovado em staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_SMOKE_URL: ${{ vars.DEPLOY_SMOKE_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_IMAGE: ${{ needs.verify-release.outputs.image }}
        run: bash scripts/deploy/ssh-update.sh "$RELEASE_IMAGE"
