quarkus.application.name=caixaverse-rewards
quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=17
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.jackson.fail-on-unknown-properties=true
quarkus.http.auth.proactive=false
mp.jwt.verify.issuer=${REWARDS_JWT_ISSUER:https://caixaverse.invalid}
quarkus.http.limits.max-body-size=32K

%dev.quarkus.datasource.jdbc.url=${REWARDS_DEV_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/rewards}
%dev.quarkus.datasource.username=${REWARDS_DEV_DB_USER:rewards}
%dev.quarkus.datasource.password=${REWARDS_DEV_DB_PASSWORD:local-rewards}
%dev.quarkus.flyway.locations=db/migration,db/demo
%dev.mp.jwt.verify.publickey.location=.local/public.pem

%test.quarkus.http.test-port=0
%test.quarkus.datasource.jdbc.url=${REWARDS_TEST_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/rewards_test}
%test.quarkus.datasource.username=${REWARDS_TEST_DB_USER:rewards}
%test.quarkus.datasource.password=${REWARDS_TEST_DB_PASSWORD:local-rewards}
%test.quarkus.flyway.locations=db/migration,db/demo

%prod.quarkus.datasource.jdbc.url=${REWARDS_JDBC_URL}
%prod.quarkus.datasource.username=${REWARDS_DB_USER}
%prod.quarkus.datasource.password=${REWARDS_DB_PASSWORD}
%prod.mp.jwt.verify.publickey.location=${REWARDS_JWT_PUBLIC_KEY_LOCATION}
%prod.mp.jwt.verify.issuer=${REWARDS_JWT_ISSUER}
%prod.quarkus.flyway.locations=db/migration
