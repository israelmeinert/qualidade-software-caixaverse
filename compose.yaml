name: caixaverse-rewards
services:
  postgres:
    image: postgres:17.12-alpine@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
    command:
      - postgres
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length_on_error=0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rewards}
      POSTGRES_USER: ${POSTGRES_USER:-rewards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-rewards}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - rewards-db:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/rewards.sql:ro
volumes:
  rewards-db:
